<!doctype html>
<html lang="ru" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EyeTrack Analyzer — XLSX → recordInfos</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            padding-top: 4.5rem
        }

        .navbar-brand code {
            font-size: .9em
        }
    </style>
</head>

<body>
    <!-- Верхнее меню -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top border-bottom border-secondary-subtle">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                EyeTrack Analyzer <span class="text-secondary">|</span> <code>db</code>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div id="topbar" class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto"></ul>
                <div class="d-flex gap-2">
                    <!-- JSON: импорт/экспорт -->
                    <input id="jsonFileInput" type="file" accept="application/json,.json" class="d-none">
                    <button id="btnImport" class="btn btn-outline-light btn-sm">Загрузить JSON</button>
                    <button id="btnExport" class="btn btn-primary btn-sm">Выгрузить JSON</button>
                    <!-- localStorage -->
                    <button id="btnSaveLocal" class="btn btn-outline-success btn-sm">Сохранить локально</button>
                    <button id="btnLoadLocal" class="btn btn-outline-info btn-sm">Загрузить локально</button>
                    <button id="btnClearLocal" class="btn btn-outline-warning btn-sm">Очистить кеш</button>
                    <!-- XLSX: импорт recordInfos -->
                    <input id="xlsxFileInput" type="file"
                        accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="d-none">
                    <button id="btnImportXlsx" class="btn btn-outline-secondary btn-sm">
                        Загрузить XLSX → recordInfos
                    </button>
                    <!-- Стимул: импорт изображения -->
                    <input id="stimFileInput" type="file" accept="image/*" class="d-none">
                    <button id="btnImportStim" class="btn btn-outline-secondary btn-sm" type="button"
                        title="Загрузить стимул (картинка)">
                        Загрузить стимул (картинка)
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- СЧЁТЧИКИ DB -->
    <div id="dbCounterWrap" class="d-none d-lg-flex align-items-center ms-2">
        <span class="badge text-bg-secondary me-1" id="cntRecordInfos" title="Количество записей в recordInfos">
            infos: 0
        </span>
        <span class="badge text-bg-secondary me-1" id="cntStimulus" title="Количество стимулов (по именам файлов)">
            stimulus: 0
        </span>
        <span class="badge text-bg-secondary me-1" id="cntRecords" title="Количество элементов в records">
            records: 0
        </span>
        <span class="badge text-bg-primary" id="cntTotal" title="Сумма всех подсчитанных ключей">
            Σ: 0
        </span>
    </div>


    <!-- Область уведомлений + просмотр db -->
    <main class="container">
        <div id="alerts" class="mt-3"></div>
        <!-- БЛОК ВЫБОРА И ОТОБРАЖЕНИЯ СТИМУЛА -->
        <section class="mt-4">
            <div class="d-flex align-items-center gap-2 mb-2">
                <label for="stimSelect" class="form-label mb-0">Стимул:</label>
                <select id="stimSelect" class="form-select form-select-sm" style="max-width: 420px;">
                    <option value="">— выберите файл —</option>
                </select>
                <button id="btnClearStim" class="btn btn-outline-secondary btn-sm" type="button">Очистить выбор</button>
            </div>

            <div id="stimMeta" class="small text-secondary mb-2">Нет выбранного стимула.</div>

            <div class="border rounded bg-body-tertiary p-2">
                <canvas id="stimCanvas" style="width: 100%; height: auto; display: block;"></canvas>
            </div>
        </section>

        <div class="mt-4">
            <h1 class="h4">Хранилище данных</h1>
            <p class="text-secondary mb-1">Глобальная структура <code>db</code> доступна как <code>window.db</code>.</p>
            <pre id="dbPreview" class="bg-body-tertiary p-3 rounded border" style="max-height:40vh;overflow:auto"></pre>
        </div>
    </main>
    <script src="./scripts/xlsx.full.min.js"></script>
    <script src="./scripts/script.js"></script>
    <script src="./scripts/dom.js"></script>
    <script src="./scripts/ls.js"></script>
    <script src="./scripts/tables.js"></script>
    <script src="./scripts/stimulus.js"></script>
    <script>

        // ---------- 6) Инициализация ----------
        (function bootstrapState() {
            try {
                const raw = localStorage.getItem(LS_KEY);
                if (raw) { const data = JSON.parse(raw); if (isValidDbObject(data)) { Object.assign(db, data); alertBox('info', 'Стартовое состояние из localStorage.'); } }
            } catch { }
            renderDbPreview();
        })();
    </script>
</body>

</html>
